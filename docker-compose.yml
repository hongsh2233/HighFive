# NCP VPS 등에서 앱 컨테이너만 구동하기 위한 참고 구성.
# - DB(PostgreSQL)는 별도 관리형 DB 또는 별도 컨테이너로 분리 운영 권장(앱 재배포 시 DB까지
#   내려가지 않도록). Nginx 리버스 프록시는 호스트에 직접 설치하는 구조를 전제로 하며,
#   이 파일에는 포함하지 않는다(docs/하이파이브_에이전시_인프라전략_v1.md §3 참고).
# - 스키마 반영(`npx prisma db push`)은 이 compose로 자동 실행되지 않는다. 배포 시
#   `docker compose exec app npx prisma db push`를 별도로 1회 실행할 것.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
  seed:
    build:
      context: .
      target: builder
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - highfive-internal
    command: npx ts-node prisma/seed.ts
