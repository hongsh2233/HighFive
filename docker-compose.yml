services:
  db:
    image: postgres:16-alpine
    container_name: highfive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: highfive
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: highfive
    volumes:
      - highfive-db-data:/var/lib/postgresql/data
    networks:
      - highfive-internal

  app:
    build:
      context: .
      target: runner
    container_name: highfive-web
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - highfive-internal
      - proxy

  migrate:
    build:
      context: .
      target: builder
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - highfive-internal
    command: npx prisma db push

  seed:
    build:
      context: .
      target: builder
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - highfive-internal
    command: npx ts-node prisma/seed.ts

volumes:
  highfive-db-data:

networks:
  highfive-internal:
  proxy:
    external: true
